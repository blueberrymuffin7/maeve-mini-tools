<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Whispering Hotel: English Quest</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #08111f;
      --ink: #0d1728;
      --panel: rgba(20, 29, 45, .86);
      --panel-strong: rgba(29, 39, 59, .94);
      --gold: #d8ad54;
      --gold-soft: #f0d28a;
      --cream: #fff3d7;
      --burgundy: #6d2637;
      --burgundy-soft: #a95462;
      --gray: #9fa7b5;
      --green: #95d7b1;
      --red: #f09a9a;
      --blue: #9fc3ff;
      --border: rgba(240, 210, 138, .28);
      --shadow: rgba(0, 0, 0, .45);
      --focus: #ffe39a;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(circle at 16% 10%, rgba(216, 173, 84, .18), transparent 28%),
        radial-gradient(circle at 84% 8%, rgba(159, 195, 255, .15), transparent 27%),
        radial-gradient(circle at 50% 80%, rgba(109, 38, 55, .35), transparent 34%),
        linear-gradient(145deg, #060b14, var(--navy) 58%, #120d18);
      padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }

    body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .001ms !important;
    }

    .hotel-shell {
      width: min(1220px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    header {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: clamp(20px, 4vw, 38px);
      background:
        linear-gradient(90deg, rgba(8, 17, 31, .95), rgba(29, 39, 59, .84)),
        radial-gradient(circle at 84% 26%, rgba(240, 210, 138, .22), transparent 28%);
      box-shadow: 0 24px 64px var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
    }

    header::before {
      content: "";
      position: absolute;
      inset: auto 6% 0 auto;
      width: 190px;
      height: 150px;
      border: 2px solid rgba(240, 210, 138, .2);
      border-bottom: 0;
      border-radius: 95px 95px 0 0;
      background: linear-gradient(rgba(159, 195, 255, .16), transparent 70%);
      box-shadow: inset 0 0 28px rgba(159, 195, 255, .12);
    }

    .topline {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 5rem);
      line-height: .92;
      letter-spacing: -.055em;
      text-shadow: 0 12px 34px rgba(0,0,0,.46);
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--gold-soft);
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      letter-spacing: .03em;
    }

    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .difficulty-control { display: grid; gap: 5px; min-width: 190px; }
    .difficulty-control label { color: var(--gold-soft); font-weight: 900; font-size: .9rem; }
    .difficulty-control select {
      min-height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(240, 210, 138, .34);
      background: rgba(8, 17, 31, .92);
      color: var(--cream);
      padding: 10px 14px;
      font: inherit;
      font-weight: 800;
    }

    button, .button-link {
      appearance: none;
      border: 1px solid rgba(240, 210, 138, .34);
      border-radius: 999px;
      min-height: 48px;
      padding: 12px 17px;
      background: rgba(255, 243, 215, .1);
      color: var(--cream);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      touch-action: manipulation;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    button:hover, .button-link:hover { transform: translateY(-1px); border-color: rgba(255, 227, 154, .72); background: rgba(255, 243, 215, .16); }
    button:disabled { cursor: not-allowed; opacity: .48; transform: none; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .primary { background: linear-gradient(135deg, rgba(216, 173, 84, .95), rgba(169, 84, 98, .86)); color: #180d12; border-color: rgba(255, 227, 154, .76); }
    .danger { border-color: rgba(240, 154, 154, .5); color: #ffd5d5; }
    .ghost { color: var(--gold-soft); }

    .grid {
      display: grid;
      grid-template-columns: minmax(240px, .8fr) minmax(0, 1.55fr) minmax(250px, .85fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 26px;
      background: linear-gradient(150deg, var(--panel-strong), rgba(13, 23, 40, .88));
      box-shadow: 0 18px 46px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
      padding: clamp(16px, 2.4vw, 24px);
    }

    .panel h2, .panel h3 { margin: 0 0 12px; }
    .panel h2 { color: var(--gold-soft); font-size: 1.25rem; }
    .panel h3 { color: var(--cream); font-size: 1.05rem; }
    .small { color: var(--gray); font-size: .95rem; line-height: 1.45; }

    .map { display: grid; gap: 10px; }
    .room-card {
      width: 100%;
      border-radius: 18px;
      padding: 14px;
      text-align: left;
      background: rgba(255,255,255,.055);
      display: grid;
      gap: 4px;
      border-color: rgba(240, 210, 138, .2);
    }
    .room-card.active { border-color: rgba(255, 227, 154, .85); box-shadow: 0 0 0 2px rgba(216, 173, 84, .15); }
    .room-card.cleared { background: linear-gradient(135deg, rgba(149, 215, 177, .15), rgba(255,255,255,.055)); }
    .room-card.locked { filter: grayscale(.3); }
    .room-name { font-weight: 900; }
    .room-skill { color: var(--gray); font-size: .9rem; }

    .story {
      position: relative;
      min-height: 166px;
      background:
        linear-gradient(135deg, rgba(109, 38, 55, .28), transparent 42%),
        linear-gradient(150deg, var(--panel-strong), rgba(13, 23, 40, .91));
    }

    .clock {
      display: inline-grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin-right: 10px;
      border-radius: 999px;
      border: 1px solid rgba(240, 210, 138, .42);
      background: rgba(255,255,255,.08);
      font-size: 1.45rem;
      vertical-align: middle;
    }

    .ghost-line {
      margin: 12px 0 0;
      padding: 13px 15px;
      border-left: 4px solid var(--gold);
      border-radius: 14px;
      background: rgba(255, 243, 215, .075);
      color: #f8e7c2;
      line-height: 1.55;
    }

    .challenge-title { color: var(--gold-soft); }
    .prompt { font-size: clamp(1.1rem, 2.6vw, 1.45rem); line-height: 1.42; margin: 12px 0 16px; }
    .choices, .chip-bank, .answer-bank { display: grid; gap: 10px; }
    .choice { border-radius: 18px; width: 100%; text-align: left; justify-content: flex-start; background: rgba(255,255,255,.065); }
    .choice.selected { border-color: rgba(255, 227, 154, .9); background: rgba(216, 173, 84, .17); }
    .choice.correct { border-color: rgba(149, 215, 177, .9); }
    .choice.wrong { border-color: rgba(240, 154, 154, .86); }

    .chip-area {
      min-height: 76px;
      padding: 12px;
      border: 1px dashed rgba(240, 210, 138, .34);
      border-radius: 18px;
      background: rgba(0,0,0,.16);
      margin-bottom: 12px;
    }
    .chip-bank, .answer-bank { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .chip { border-radius: 16px; background: rgba(159, 195, 255, .11); }
    .chip.used { opacity: .35; }

    textarea {
      width: 100%;
      min-height: 86px;
      border-radius: 18px;
      border: 1px solid rgba(240, 210, 138, .28);
      background: rgba(0,0,0,.22);
      color: var(--cream);
      padding: 14px;
      font: inherit;
      resize: vertical;
    }

    .feedback {
      margin-top: 16px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.11);
      line-height: 1.5;
    }
    .feedback.good { border-color: rgba(149, 215, 177, .65); }
    .feedback.bad { border-color: rgba(240, 154, 154, .65); }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat, .item, .achievement {
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 16px;
      padding: 10px 12px;
      background: rgba(255,255,255,.055);
    }
    .stat strong { display: block; color: var(--gold-soft); font-size: 1.2rem; }
    .inventory, .achievements { display: grid; gap: 8px; margin-top: 10px; }
    .item.have, .achievement.have { border-color: rgba(149, 215, 177, .58); color: #d9ffe7; }
    .item.missing, .achievement.missing { color: rgba(255,243,215,.55); }

    .pup-note { background: linear-gradient(135deg, rgba(216, 173, 84, .15), rgba(109, 38, 55, .18)); }
    .notebook-list { display: grid; gap: 10px; max-height: 360px; overflow: auto; padding-right: 4px; }
    .mistake-card { border-radius: 16px; border: 1px solid rgba(240, 210, 138, .18); padding: 12px; background: rgba(0,0,0,.15); }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .privacy { margin-top: 12px; color: var(--gray); font-size: .88rem; }
    .secret { color: var(--gold-soft); font-weight: 900; }

    @keyframes glow { 50% { box-shadow: 0 0 32px rgba(216, 173, 84, .22); } }
    .panel:not(.static-glow) { animation: glow 5s ease-in-out infinite; }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .map { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      body { padding-left: 10px; padding-right: 10px; }
      .map { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .header-actions { justify-content: flex-start; }
      button, .button-link { width: 100%; justify-content: center; }
      .room-card, .choice, .chip { min-height: 54px; }
    }
  </style>
</head>
<body>
  <main class="hotel-shell">
    <header>
      <div class="topline">
        <div>
          <h1>The Whispering Hotel</h1>
          <p class="subtitle">Speak carefully. The hotel listens.</p>
        </div>
        <div class="header-actions">
          <a class="button-link" href="index.html">← Back to hub</a>
          <button id="dailyReplayBtn" type="button">Daily Replay</button>
          <button id="practiceBtn" type="button">Practice mistakes</button>
          <button id="motionBtn" type="button" aria-pressed="false">Reduce motion</button>
          <div class="difficulty-control">
            <label for="difficultySelect">Difficulty</label>
            <select id="difficultySelect" aria-label="Difficulty setting">
              <option value="guided">Guided</option>
              <option value="standard">Standard</option>
              <option value="challenge">Challenge</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <section class="grid" aria-label="The Whispering Hotel game">
      <aside class="panel static-glow" aria-labelledby="mapTitle">
        <h2 id="mapTitle">Hotel Map</h2>
        <div id="map" class="map"></div>
      </aside>

      <section aria-live="polite">
        <article id="storyPanel" class="panel story"></article>
        <article id="challengePanel" class="panel" style="margin-top:18px;"></article>
      </section>

      <aside>
        <section class="panel static-glow" aria-labelledby="progressTitle">
          <h2 id="progressTitle">Inventory & Progress</h2>
          <div id="stats" class="stats"></div>
          <h3>Items</h3>
          <div id="inventory" class="inventory"></div>
          <h3>Achievements</h3>
          <div id="achievements" class="achievements"></div>
        </section>
        <section class="panel pup-note static-glow" style="margin-top:18px;" aria-labelledby="pupTitle">
          <h2 id="pupTitle">Pup’s note</h2>
          <p id="pupNote" class="small"></p>
        </section>
        <section class="panel static-glow" style="margin-top:18px;" aria-labelledby="notebookTitle">
          <h2 id="notebookTitle">Mistake Notebook</h2>
          <div id="notebook" class="notebook-list"></div>
          <div class="controls"><button id="clearMistakesBtn" class="danger" type="button">Clear notebook</button></div>
          <p class="privacy">Your progress is saved only in this browser on this device.</p>
        </section>
      </aside>
    </section>
  </main>

        ['the main thing', 'the most striking feature', ['the most striking feature','the mainly thing','the thing most strike','the most feature striking'], '“Feature” is useful for descriptions.'],
        ['looks old', 'appears antique', ['appears antique','looks anciently','appears very old','old appears'], '“Appears antique” is more precise.'],
        ['a sad face', 'a melancholic expression', ['a melancholic expression','a sadness face','a face sadly','a melancholy expression'], '“Expression” describes faces well.'],
        ['a bright color', 'a vivid colour', ['a vivid colour','a bright colour','a vividness colour','a colour vividly'], '“Vivid” is a precise adjective.'],
        ['a quiet place', 'a tranquil setting', ['a tranquil setting','a quietly setting','a place quiet','a tranquillity setting'], '“Setting” is useful for describing scenes.'],
        ['a strange object', 'an unusual object', ['an unusual object','a strangely object','a object unusual','an object unusually'], '“Unusual” is natural before a noun.'],
        ['the two rooms are different', 'the two rooms contrast sharply', ['the two rooms contrast sharply','the two rooms different sharply','the two rooms are sharply difference','the two rooms contrast sharp'], 'Use “contrast” as a verb with an adverb.']
      ];
      var speakingPrompts = [
        ['Describe the lobby in 20 seconds using one phrase.', ['It seems as if...', 'I noticed that...', 'The most striking detail is...']],
        ['Describe the library as if you were in an IELTS speaking test.', ['In the background...', 'What stands out is...', 'The room gives the impression of...']],
        ['Compare the kitchen with the lobby.', ['Compared with...', 'Whereas the lobby...', 'Both rooms seem...']],
        ['Describe a portrait in the gallery.', ['The person appears to be...', 'Their expression suggests...', 'One noticeable feature is...']],
        ['Describe the final door.', ['It looks as though...', 'The atmosphere feels...', 'The detail that draws my attention is...']],
        ['Describe the mirror hall without using “scary.”', ['The corridor feels unsettling because...', 'I noticed a pattern in...', 'The reflections make the space seem...']],
        ['Explain which room you would avoid and why.', ['I would avoid...', 'The main reason is...', 'Another factor is...']],
        ['Describe an object from your inventory.', ['It appears to be...', 'It might be used for...', 'Its most distinctive feature is...']],
        ['Summarize your escape plan.', ['First, I would...', 'After that...', 'Finally...']],
        ['Describe the hotel’s atmosphere.', ['Overall, the atmosphere is...', 'The lighting creates...', 'This makes the hotel feel...']],
        ['Talk about a mistake you learned from.', ['At first, I thought...', 'Then I realised...', 'Next time, I will...']],
        ['Describe the attic candle.', ['It seems as if...', 'I noticed that...', 'The candle may represent...']],
        ['Explain why polite English matters.', ['Polite language helps because...', 'For instance...', 'As a result...']],
        ['Describe the elevator using linkers.', ['Although...', 'However...', 'Therefore...']],
        ['Choose your favorite phrase and use it in a sentence.', ['My favorite phrase is...', 'I can use it when...', 'For example...']]
      ];

      return {
        dialogue: dialoguePrompts.map(function (d, i) { return makeChoice('dialogue-' + (i + 1), 'lobby', 'Ghost: “' + d[0] + '”', [d[1], d[2], d[3], d[4]], d[1], 'This reply is natural, polite, and grammatically complete.', 'Avoid direct translation and missing auxiliary verbs.', d[1]); }),
        order: orderData.map(function (parts, i) { return makeOrder('order-' + (i + 1), 'library', parts, parts.join(' '), 'The clauses connect in a logical sentence shape.'); }),
        collocation: collocations.map(function (c, i) { return makeChoice('collocation-' + (i + 1), 'kitchen', c[0], c[2], c[1], c[3], 'Prepositions often belong to fixed phrases; learn them as chunks.', c[0].replace('___', c[1])); }),
        correction: corrections.map(function (c, i) { return makeChoice('correction-' + (i + 1), 'mirror', 'Incorrect: ' + c[0], c[2], c[1], c[3], 'Check subject-verb agreement, word order, articles, and countability.', c[1]); }),
        linker: linkers.map(function (l, i) { return makeChoice('linker-' + (i + 1), 'elevator', l[0], l[2], l[1], l[3], 'Read both clauses first, then decide whether the relationship is reason, contrast, result, addition, or example.', l[0].replace('___', l[1])); }),
        wordFamily: wordFamilies.map(function (w, i) { return makeChoice('word-' + (i + 1), 'attic', w[0], w[2], w[1], w[3], 'Look at the grammar slot: noun, verb, adjective, or adverb.', w[0].replace('___', w[1])); }),
        upgrade: upgrades.map(function (u, i) { return makeChoice('upgrade-' + (i + 1), 'gallery', 'Upgrade this phrase: “' + u[0] + '”', u[2], u[1], u[3], 'Avoid adjective order mistakes and word-family confusion.', u[1]); }),
        speaking: speakingPrompts.map(function (s, i) { return makeSpeaking('speaking-' + (i + 1), s[0], s[1]); })
      };
    }

    var questionBank = buildQuestionBank();
    decorateQuestionBank();

    function defaultState() {
      return {
        unlockedRooms: ['lobby'],
        clearedRooms: [],
        inventory: [],
        achievements: [],
        mistakes: [],
        favoritePhrases: [],
        score: 0,
        streak: 0,
        totalAnswered: 0,
        totalCorrect: 0,
        secretsFound: [],
        weakQuestions: [],
        currentRoomId: 'lobby',
        reduceMotion: false,
        ended: false,
        difficulty: 'standard',
        version: SAVE_VERSION
      };
    }

    function initGame() {
      loadGame();
      bindGlobalButtons();
      currentRoomId = playerState.currentRoomId || 'lobby';
      document.body.classList.toggle('reduce-motion', playerState.reduceMotion);
      document.getElementById('motionBtn').setAttribute('aria-pressed', String(playerState.reduceMotion));
      document.getElementById('difficultySelect').value = playerState.difficulty;
      renderAll();
    }

    function loadGame() {
      try {
        var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        playerState = Object.assign(defaultState(), saved || {});
        if (!difficultyLabels[playerState.difficulty]) playerState.difficulty = 'standard';
        playerState.version = SAVE_VERSION;
      } catch (error) {
        playerState = defaultState();
      }
    }

    function saveGame() {
      playerState.currentRoomId = currentRoomId;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(playerState));
    }

    function resetGame() {
      if (!confirm('Reset the hotel and start again? Your mistake notebook will also be cleared.')) return;
      playerState = defaultState();
      currentRoomId = 'lobby';
      currentSet = [];
      currentIndex = 0;
      currentMode = 'room';
      saveGame();
      renderAll();
    }

    function bindGlobalButtons() {
      document.getElementById('dailyReplayBtn').addEventListener('click', startDailyReplay);
      document.getElementById('practiceBtn').addEventListener('click', practiceMistakes);
      document.getElementById('clearMistakesBtn').addEventListener('click', function () {
        if (confirm('Clear the mistake notebook?')) {
          playerState.mistakes = [];
          saveGame();
          renderNotebook();
        }
      });
      document.getElementById('motionBtn').addEventListener('click', function () {
        playerState.reduceMotion = !playerState.reduceMotion;
        document.body.classList.toggle('reduce-motion', playerState.reduceMotion);
        this.setAttribute('aria-pressed', String(playerState.reduceMotion));
        saveGame();
      });
      document.getElementById('difficultySelect').addEventListener('change', function () {
        playerState.difficulty = this.value;
        currentSet = [];
        saveGame();
        renderAll();
      });
    }

    function renderAll() {
      renderMap();
      renderRoom();
      renderStats();
      renderInventory();
      renderAchievements();
      renderNotebook();
      renderPupNote();
    }

    function renderMap() {
      var map = document.getElementById('map');
      map.innerHTML = '';
      roomOrder.forEach(function (id) {
        var room = rooms[id];
        var unlocked = playerState.unlockedRooms.indexOf(id) !== -1 || isRoomAvailable(id);
        var cleared = playerState.clearedRooms.indexOf(id) !== -1;
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'room-card' + (id === currentRoomId ? ' active' : '') + (cleared ? ' cleared' : '') + (!unlocked ? ' locked' : '');
        button.disabled = !unlocked;
        button.innerHTML = '<span class="room-name">' + (unlocked ? '' : 'Locked: ') + room.name + '</span><span class="room-skill">' + room.skill + '</span><span class="room-skill">' + (cleared ? 'Cleared' : unlocked ? 'Unlocked' : 'Requires earlier items') + '</span>';
        button.addEventListener('click', function () { currentRoomId = id; currentMode = 'room'; currentSet = []; saveGame(); renderAll(); });
        map.appendChild(button);
      });
    }

    function renderRoom() {
      var room = rooms[currentRoomId];
      var story = document.getElementById('storyPanel');
      var clock = currentRoomId === 'lobby' ? '<button class="clock" id="lobbyClock" type="button" aria-label="Lobby clock">◷</button>' : '';
      story.innerHTML = '<h2>' + clock + room.name + ': ' + room.skill + '</h2><p class="small"><strong>Goal:</strong> ' + room.goal + '</p><p>' + room.description + '</p><p class="ghost-line">' + room.ghost + '</p><div id="secretLine"></div>';
      if (currentRoomId === 'lobby') {
        document.getElementById('lobbyClock').addEventListener('click', handleClockSecret);
      }
      if (playerState.secretsFound.indexOf('clock') !== -1) {
        document.getElementById('secretLine').innerHTML = '<p class="secret">Secret phrase: “The hotel repeats what you avoid.”</p>';
      }
      if (playerState.ended) {
        renderEndScreen();
      } else if (currentSet.length) {
        renderChallenge();
      } else {
        renderRoomIntro();
      }
    }

    function renderRoomIntro() {
      var panel = document.getElementById('challengePanel');
      var room = rooms[currentRoomId];
      var cleared = playerState.clearedRooms.indexOf(currentRoomId) !== -1;
      var lockedFinal = currentRoomId === 'final' && !hasAllPreFinalItems();
      panel.innerHTML = '<h2 class="challenge-title">Room Challenge</h2><p class="prompt">' + (cleared ? 'You have cleared this room. You may replay it for practice, or choose another room.' : 'Complete this room to collect: ' + itemName(room.item) + '.') + '</p><p class="small">Most answers are tapped choices. Sentence strips can be tapped into order. Speaking prompts are self-rated.</p><div class="controls"><button class="primary" id="startRoomBtn" type="button" ' + (lockedFinal ? 'disabled' : '') + '>' + (cleared ? 'Replay room' : 'Start room') + '</button><button id="resetBtn" type="button">Play again / reset</button></div>' + (lockedFinal ? '<p class="feedback bad">The Final Door listens for all seven earlier items before it unlocks.</p>' : '');
      document.getElementById('startRoomBtn').addEventListener('click', function () { startRoom(currentRoomId); });
      document.getElementById('resetBtn').addEventListener('click', resetGame);
    }

    function startRoom(roomId) {
      if (roomId === 'final' && !hasAllPreFinalItems()) return;
      currentRoomId = roomId;
      currentMode = 'room';
      var room = rooms[roomId];
      if (roomId === 'final') {
        currentSet = buildFinalSet();
      } else {
        currentSet = buildRoomSet(roomId, playerState.difficulty);
      }
      currentSet = prepareChallengeSet(currentSet, playerState.difficulty);
      currentIndex = 0;
      sessionCorrect = 0;
      sessionMistakes = 0;
      finalMissedSkills = [];
      selectedAnswer = '';
      orderedChips = [];
      answered = false;
      saveGame();
      renderAll();
    }

    function nextChallenge() {
      currentIndex += 1;
      selectedAnswer = '';
      orderedChips = [];
      answered = false;
      if (currentIndex >= currentSet.length) {
        completeCurrentSet();
      } else {
        renderChallenge();
      }
      renderStats();
      renderNotebook();
      renderPupNote();
    }

    function renderChallenge() {
      var q = currentSet[currentIndex];
      var panel = document.getElementById('challengePanel');
      var progress = '<p class="small">Challenge ' + (currentIndex + 1) + ' of ' + currentSet.length + ' · Score this round: ' + sessionCorrect + ' · Difficulty: ' + difficultyLabels[playerState.difficulty] + '</p>';
      panel.innerHTML = '<h2 class="challenge-title">' + rooms[currentRoomId].name + '</h2>' + progress + '<div id="challengeBody"></div><div id="feedback"></div>';
      if (q.type === 'order') renderOrder(q); else if (q.type === 'speaking') renderSpeaking(q); else renderChoice(q);
    }

    function renderChoice(q) {
      var body = document.getElementById('challengeBody');
      body.innerHTML = '<p class="prompt">' + q.prompt + '</p><div class="choices" id="choices"></div>';
      var choices = document.getElementById('choices');
      (q.playChoices || q.choices).forEach(function (choice) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice';
        btn.textContent = choice;
        btn.addEventListener('click', function () { handleChoice(choice); });
        choices.appendChild(btn);
      });
    }

    function handleChoice(choice) {
      if (answered) return;
      selectedAnswer = choice;
      checkAnswer();
    }

    function renderOrder(q) {
      var body = document.getElementById('challengeBody');
      body.innerHTML = '<p class="prompt">' + q.prompt + '</p><div class="chip-area"><div class="answer-bank" id="answerBank" aria-label="Your sentence order"></div></div><div class="chip-bank" id="chipBank"></div><div class="controls"><button id="undoChipBtn" type="button">Undo last chip</button><button class="primary" id="checkOrderBtn" type="button">Check sentence</button></div>';
      drawChips(q);
      document.getElementById('undoChipBtn').addEventListener('click', function () { orderedChips.pop(); drawChips(q); });
      document.getElementById('checkOrderBtn').addEventListener('click', handleSentenceOrder);
    }

    function drawChips(q) {
      var answerBank = document.getElementById('answerBank');
      var chipBank = document.getElementById('chipBank');
      answerBank.innerHTML = '';
      chipBank.innerHTML = '';
      orderedChips.forEach(function (chipId) {
        var span = document.createElement('button');
        span.type = 'button';
        span.className = 'chip';
        span.textContent = chipTextById(q, chipId);
        span.addEventListener('click', function () { orderedChips.splice(orderedChips.indexOf(chipId), 1); drawChips(q); });
        answerBank.appendChild(span);
      });
      (q.playChips || []).forEach(function (chip) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip' + (orderedChips.indexOf(chip.id) !== -1 ? ' used' : '');
        btn.textContent = chip.display;
        btn.disabled = orderedChips.indexOf(chip.id) !== -1 || answered;
        btn.addEventListener('click', function () { orderedChips.push(chip.id); drawChips(q); });
        chipBank.appendChild(btn);
      });
    }

    function handleSentenceOrder() {
      if (answered) return;
      selectedAnswer = orderedChips.join(' ');
      checkAnswer();
    }

    function renderSpeaking(q) {
      var body = document.getElementById('challengeBody');
      body.innerHTML = '<p class="prompt">' + q.prompt + '</p><ul>' + q.phrases.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul><textarea id="favoritePhrase" placeholder="Optional: save a favorite phrase or your sentence."></textarea><div class="controls"><button type="button" data-rate="Weak">Weak</button><button type="button" data-rate="Okay">Okay</button><button class="primary" type="button" data-rate="Strong">Strong</button></div>';
      body.querySelectorAll('[data-rate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (answered) return;
          selectedAnswer = btn.getAttribute('data-rate');
          var phrase = document.getElementById('favoritePhrase').value.trim();
          if (phrase) playerState.favoritePhrases.unshift(phrase);
          answered = true;
          var strong = selectedAnswer === 'Strong';
          registerAnswer(strong, q, selectedAnswer);
          showFeedback(strong, q, selectedAnswer);
        });
      });
    }

    function checkAnswer() {
      var q = currentSet[currentIndex];
      answered = true;
      var correct;
      if (q.type === 'order') {
        correct = orderedChips.join('|') === q.correctOrder.join('|');
        selectedAnswer = orderedChips.map(function (id) { return chipTextById(q, id); }).join(' ');
      } else {
        var normalizedUser = normalize(selectedAnswer);
        var normalizedAnswer = normalize(q.answer);
        correct = normalizedUser === normalizedAnswer;
      }
      registerAnswer(correct, q, selectedAnswer);
      showFeedback(correct, q, selectedAnswer);
    }

    function registerAnswer(correct, q, userAnswer) {
      playerState.totalAnswered += 1;
      if (correct) {
        playerState.totalCorrect += 1;
        playerState.score += 10 + Math.min(playerState.streak, 5);
        playerState.streak += 1;
        sessionCorrect += 1;
      } else {
        playerState.streak = 0;
        sessionMistakes += 1;
        saveMistake(q, userAnswer);
        if (currentMode === 'room' && currentRoomId === 'final') finalMissedSkills.push(getSkillLabel(q));
      }
      saveGame();
      renderStats();
    }

    function showFeedback(correct, q, userAnswer) {
      var fb = document.getElementById('feedback');
      fb.className = 'feedback ' + (correct ? 'good' : 'bad');
      var answerLabel = q.type === 'order' ? 'Your order' : 'Your answer';
      var correctLabel = q.type === 'order' ? 'Model sentence' : 'Correct answer';
      var whyLabel = q.type === 'order' ? 'Structure explanation' : 'Why it works';
      fb.innerHTML = '<h3>' + (correct ? 'Correct. The lock sighs open.' : 'Needs work. The chandelier trembles.') + '</h3>' +
        '<p><strong>' + answerLabel + ':</strong> ' + escapeHTML(userAnswer || '—') + '</p>' +
        '<p><strong>' + correctLabel + ':</strong> ' + escapeHTML(q.answer) + '</p>' +
        '<p><strong>Skill tested:</strong> ' + escapeHTML(getSkillLabel(q)) + '</p>' +
        '<p><strong>Difficulty:</strong> ' + escapeHTML(getDifficultyForQuestion(q)) + '</p>' +
        '<p><strong>' + whyLabel + ':</strong> ' + escapeHTML(q.explanation) + '</p>' +
        '<p><strong>Common trap:</strong> ' + escapeHTML(q.common) + '</p>' +
        '<p><strong>Example:</strong> ' + escapeHTML(q.example) + '</p>' +
        (!correct ? '<p class="ghost-line">The ghost looks disappointed but not surprised. “Useful mistake. Put it in the notebook.”</p>' : '') +
        '<div class="controls"><button class="primary" id="nextBtn" type="button">Next</button></div>';
      document.getElementById('nextBtn').addEventListener('click', nextChallenge);
      document.querySelectorAll('#challengeBody button').forEach(function (button) { button.disabled = true; });
      renderNotebook();
      renderAchievements();
    }

    function saveMistake(q, userAnswer) {
      playerState.mistakes.unshift({
        id: q.id,
        question: q.prompt,
        userAnswer: userAnswer || 'No answer',
        correctAnswer: q.answer,
        explanation: q.explanation,
        skill: getSkillLabel(q),
        difficulty: getDifficultyForQuestion(q),
        room: rooms[q.room] ? rooms[q.room].name : rooms[currentRoomId].name,
        date: new Date().toISOString().slice(0, 10)
      });
      if (playerState.mistakes.length >= 5) unlockAchievement('mistakeHunter');
      if (playerState.weakQuestions.indexOf(q.id) === -1) playerState.weakQuestions.push(q.id);
    }

    function practiceMistakes() {
      var mistakeQuestions = shuffleArray(playerState.mistakes.map(function (m) { return findQuestion(m.id); }).filter(Boolean)).slice(0, 10);
      if (!mistakeQuestions.length) {
        alert('No mistakes yet. The hotel is impressed, or suspicious. Try Daily Replay for review.');
        return;
      }
      currentMode = 'mistakes';
      currentRoomId = mistakeQuestions[0].room || 'lobby';
      currentSet = prepareChallengeSet(mistakeQuestions, playerState.difficulty);
      currentIndex = 0;
      sessionCorrect = 0;
      sessionMistakes = 0;
      answered = false;
      renderAll();
    }

    function startDailyReplay() {
      var mistakeQuestions = shuffleArray(playerState.mistakes.map(function (m) { return findQuestion(m.id); }).filter(Boolean));
      var randomReview = shuffleArray(getAllQuestions().filter(function (q) { return q.type !== 'speaking'; }));
      var mistakeCount = playerState.difficulty === 'challenge' ? 7 : 5;
      var review = uniqueQuestions(mistakeQuestions.slice(0, mistakeCount).concat(randomReview)).slice(0, 10);
      currentMode = 'daily';
      currentRoomId = review[0].room || 'lobby';
      currentSet = prepareChallengeSet(review, playerState.difficulty);
      currentIndex = 0;
      sessionCorrect = 0;
      sessionMistakes = 0;
      answered = false;
      renderAll();
    }

    function completeCurrentSet() {
      if (currentMode === 'room') {
        if (currentRoomId === 'final') {
          finishGame(sessionCorrect);
          return;
        }
        clearRoom(currentRoomId);
      }
      currentSet = [];
      currentIndex = 0;
      currentMode = 'room';
      saveGame();
      renderAll();
      document.getElementById('challengePanel').insertAdjacentHTML('beforeend', '<div class="feedback good"><h3>Round complete.</h3><p>You answered ' + sessionCorrect + ' of ' + (sessionCorrect + sessionMistakes) + ' challenges correctly.</p></div>');
    }

    function clearRoom(roomId) {
      if (playerState.clearedRooms.indexOf(roomId) === -1) playerState.clearedRooms.push(roomId);
      addItem(rooms[roomId].item);
      if (sessionMistakes === 0) unlockAchievement('cleanSentence');
      if (roomId === 'lobby') unlockAchievement('firstKey');
      if (roomId === 'mirror') unlockAchievement('fixedMirror');
      if (roomId === 'elevator') unlockAchievement('linkerTamer');
      if (roomId === 'attic') unlockAchievement('wordFamilyWitch');
      unlockRoom(nextRoomId(roomId));
    }

    function unlockRoom(roomId) {
      if (roomId && playerState.unlockedRooms.indexOf(roomId) === -1) playerState.unlockedRooms.push(roomId);
      if (hasAllPreFinalItems() && playerState.unlockedRooms.indexOf('final') === -1) playerState.unlockedRooms.push('final');
    }

    function addItem(itemId) {
      if (itemId && playerState.inventory.indexOf(itemId) === -1) playerState.inventory.push(itemId);
    }

    function unlockAchievement(id) {
      if (playerState.achievements.indexOf(id) === -1) playerState.achievements.push(id);
    }

    function finishGame(finalCorrect) {
      if (finalCorrect >= 6) {
        addItem('finalKey');
        unlockAchievement('hotelLetYouLeave');
        if (finalCorrect === 8) unlockAchievement('fluentEscape');
        playerState.ended = true;
        currentSet = [];
        saveGame();
        renderAll();
      } else {
        currentSet = [];
        saveGame();
        renderAll();
        document.getElementById('challengePanel').innerHTML = '<h2>The Final Door stays closed.</h2><p class="prompt">You answered ' + finalCorrect + ' of 8. The hotel requires at least 6 correct answers.</p><p class="small">Missed skills: ' + escapeHTML(uniqueText(finalMissedSkills).join(', ') || 'mixed review') + '.</p><p class="small">Review the missed items in your notebook, then retry.</p><div class="controls"><button class="primary" id="retryFinalBtn" type="button">Retry Final Door</button><button id="practiceFinalMistakesBtn" type="button">Practice mistakes</button></div>';
        document.getElementById('retryFinalBtn').addEventListener('click', function () { startRoom('final'); });
        document.getElementById('practiceFinalMistakesBtn').addEventListener('click', practiceMistakes);
      }
    }

    function renderEndScreen() {
      var accuracy = playerState.totalAnswered ? Math.round(playerState.totalCorrect / playerState.totalAnswered * 100) : 0;
      var fav = playerState.favoritePhrases[0] || 'It seems as if the hotel wanted me to learn.';
      document.getElementById('challengePanel').innerHTML = '<h2>Escaped!</h2><p class="prompt">The final key turns. The hotel bows with all its windows.</p><div class="stats"><div class="stat"><span>Final score</span><strong>' + playerState.score + '</strong></div><div class="stat"><span>Accuracy</span><strong>' + accuracy + '%</strong></div><div class="stat"><span>Mistakes made</span><strong>' + playerState.mistakes.length + '</strong></div><div class="stat"><span>Rooms cleared</span><strong>' + playerState.clearedRooms.length + '</strong></div></div><p><strong>Favorite phrase learned:</strong> ' + escapeHTML(fav) + '</p><p><strong>Achievements:</strong> ' + playerState.achievements.map(achievementName).join(', ') + '</p><div class="controls"><button class="primary" id="playAgainBtn" type="button">Play again</button><button id="endPracticeBtn" type="button">Practice mistakes</button><a class="button-link" href="index.html">Back to hub</a></div>';
      document.getElementById('playAgainBtn').addEventListener('click', resetGame);
      document.getElementById('endPracticeBtn').addEventListener('click', practiceMistakes);
    }

    function renderStats() {
      var stats = document.getElementById('stats');
      stats.innerHTML = [
        ['Score', playerState.score],
        ['Streak', playerState.streak],
        ['Mistakes', playerState.mistakes.length],
        ['Rooms unlocked', playerState.unlockedRooms.length],
        ['Secrets found', playerState.secretsFound.length],
        ['Accuracy', (playerState.totalAnswered ? Math.round(playerState.totalCorrect / playerState.totalAnswered * 100) : 0) + '%']
      ].map(function (s) { return '<div class="stat"><span>' + s[0] + '</span><strong>' + s[1] + '</strong></div>'; }).join('');
    }

    function renderInventory() {
      document.getElementById('inventory').innerHTML = inventoryItems.map(function (item) {
        var have = playerState.inventory.indexOf(item.id) !== -1;
        return '<div class="item ' + (have ? 'have' : 'missing') + '">' + (have ? '✓ ' : '□ ') + item.name + '</div>';
      }).join('');
    }

    function renderAchievements() {
      document.getElementById('achievements').innerHTML = achievementList.map(function (a) {
        var have = playerState.achievements.indexOf(a.id) !== -1;
        return '<div class="achievement ' + (have ? 'have' : 'missing') + '">' + (have ? '★ ' : '☆ ') + a.name + '</div>';
      }).join('');
    }

    function renderNotebook() {
      var notebook = document.getElementById('notebook');
      if (!playerState.mistakes.length) {
        notebook.innerHTML = '<p class="small">No mistakes saved yet. The wallpaper is quietly impressed.</p>';
        return;
      }
      notebook.innerHTML = playerState.mistakes.slice(0, 8).map(function (m) {
        return '<article class="mistake-card"><strong>' + escapeHTML(m.room) + ' · ' + escapeHTML(m.date) + '</strong><p>' + escapeHTML(m.question) + '</p><p><strong>Your answer:</strong> ' + escapeHTML(m.userAnswer) + '</p><p><strong>Correct:</strong> ' + escapeHTML(m.correctAnswer) + '</p><p class="small"><strong>Skill:</strong> ' + escapeHTML(m.skill || 'review') + ' · <strong>Difficulty:</strong> ' + escapeHTML(m.difficulty || 'Standard') + '</p><p class="small">' + escapeHTML(m.explanation) + '</p></article>';
      }).join('');
    }

    function renderPupNote() {
      document.getElementById('pupNote').textContent = pupNotes[(playerState.totalAnswered + playerState.streak) % pupNotes.length];
    }

    function buildFinalSet() {
      var mistakeLimit = playerState.difficulty === 'challenge' ? 4 : playerState.difficulty === 'guided' ? 2 : 3;
      var fromMistakes = shuffleArray(playerState.mistakes.map(function (m) { return findQuestion(m.id); }).filter(Boolean)).slice(0, mistakeLimit);
      var mixed = shuffleArray([].concat(questionBank.dialogue, questionBank.order, questionBank.collocation, questionBank.correction, questionBank.upgrade, questionBank.linker, questionBank.wordFamily).filter(function (q) { return q.type !== 'speaking' && q.difficulty !== 'easy'; }));
      return uniqueQuestions(fromMistakes.concat(mixed)).slice(0, 8);
    }

    function startRoomFromDebug(roomId) { startRoom(roomId); }

    function hasAllPreFinalItems() {
      return inventoryItems.filter(function (item) { return item.id !== 'finalKey'; }).every(function (item) { return playerState.inventory.indexOf(item.id) !== -1; });
    }

    function isRoomAvailable(id) {
      if (id === 'final') return hasAllPreFinalItems();
      var previous = roomOrder[roomOrder.indexOf(id) - 1];
      return !previous || playerState.clearedRooms.indexOf(previous) !== -1;
    }

    function nextRoomId(roomId) { return roomOrder[roomOrder.indexOf(roomId) + 1]; }
    function itemName(id) { var item = inventoryItems.filter(function (i) { return i.id === id; })[0]; return item ? item.name : 'mystery item'; }
    function achievementName(id) { var a = achievementList.filter(function (item) { return item.id === id; })[0]; return a ? a.name : id; }

    function findQuestion(id) {
      return getAllQuestions().filter(function (q) { return q.id === id; })[0];
    }

    function getAllQuestions() {
      return Object.keys(questionBank).reduce(function (all, key) { return all.concat(questionBank[key]); }, []);
    }

    function uniqueQuestions(list) {
      var seen = {};
      return list.filter(function (q) {
        if (!q || seen[q.id]) return false;
        seen[q.id] = true;
        return true;
      });
    }

    function shuffle(array) { return shuffleArray(array); }



    function decorateQuestionBank() {
      Object.keys(questionBank).forEach(function (bankName) {
        questionBank[bankName].forEach(function (q, index) {
          var ratio = index / Math.max(questionBank[bankName].length - 1, 1);
          q.difficulty = ratio < .35 ? 'easy' : ratio < .75 ? 'medium' : 'hard';
          q.isRoomLock = ratio > .85;
          q.skill = q.skill || rooms[q.room].skill;
        });
      });
    }

    function shuffleArray(array) {
      var copy = array.slice();
      for (var i = copy.length - 1; i > 0; i -= 1) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function buildRoomSet(roomId, difficulty) {
      var room = rooms[roomId];
      var bank = questionBank[room.bank] || [];
      var easy = shuffleArray(bank.filter(function (q) { return q.difficulty === 'easy'; }));
      var medium = shuffleArray(bank.filter(function (q) { return q.difficulty === 'medium'; }));
      var hard = shuffleArray(bank.filter(function (q) { return q.difficulty === 'hard'; }));
      var selected;
      if (difficulty === 'guided') selected = easy.slice(0, 3).concat(medium.slice(0, 2), hard.slice(0, 1));
      else if (difficulty === 'challenge') selected = easy.slice(0, 1).concat(medium.slice(0, 2), hard.slice(0, 3));
      else selected = easy.slice(0, 2).concat(medium.slice(0, 3), hard.slice(0, 1));
      selected = uniqueQuestions(selected.concat(shuffleArray(bank))).slice(0, room.count);
      var lockPool = hard.length ? hard : medium.length ? medium : bank;
      selected[selected.length - 1] = shuffleArray(lockPool)[0] || selected[selected.length - 1];
      selected = uniqueQuestions(selected.concat(shuffleArray(bank))).slice(0, room.count);
      if (room.speaking) selected = selected.concat(shuffleArray(questionBank.speaking).slice(0, difficulty === 'guided' ? 1 : 2));
      return selected;
    }

    function prepareChallengeSet(set, difficulty) {
      return set.map(function (q) {
        if (q.type === 'order') return prepareOrderQuestion(q, difficulty);
        if (q.type === 'choice') return prepareChoiceQuestion(q, difficulty);
        return Object.assign({}, q);
      });
    }

    function prepareChoiceQuestion(q, difficulty) {
      var clone = Object.assign({}, q);
      var choices = q.choices.slice();
      if (difficulty === 'guided') choices = choices.slice(0, Math.min(choices.length, 4));
      if (choices.indexOf(q.answer) === -1) choices[choices.length - 1] = q.answer;
      // Never render choices in authoring order and never rely on index 0 as correct.
      clone.playChoices = shuffleArray(choices);
      return clone;
    }

    function prepareOrderQuestion(q, difficulty) {
      var clone = Object.assign({}, q);
      var chips = q.chips.map(function (text, index) {
        return { id: q.id + '-chip-' + index, text: text, display: normalizeDisplayedChip(text), distractor: false };
      });
      clone.correctOrder = chips.map(function (chip) { return chip.id; });
      if (difficulty === 'challenge' && chips.length >= 4) {
        chips.push({ id: q.id + '-distractor', text: 'the hotel repeats the clue', display: 'the hotel repeats the clue', distractor: true });
      }
      // Sentence-order chips must not display capitalization or punctuation cues.
      clone.playChips = shuffleArray(chips);
      return clone;
    }

    function normalizeDisplayedChip(text) {
      return String(text || '')
        .replace(/[.,!?;:]+$/g, '')
        .replace(/[,:;]+/g, '')
        .trim()
        .replace(/^./, function (c) { return c.toLowerCase(); });
    }

    function chipTextById(q, id) {
      var chip = (q.playChips || []).filter(function (item) { return item.id === id; })[0];
      return chip ? chip.display : id;
    }

    function getDifficultyForQuestion(q) { return difficultyLabels[q.difficulty] || difficultyLabels[playerState.difficulty] || 'Standard'; }
    function getSkillLabel(q) { return q.skill || (rooms[q.room] && rooms[q.room].skill) || 'mixed review'; }

    function uniqueText(list) {
      var seen = {};
      return list.filter(function (item) {
        if (!item || seen[item]) return false;
        seen[item] = true;
        return true;
      });
    }

    function normalize(value) { return String(value || '').toLowerCase().replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/\s+/g, ' ').trim(); }
    function escapeHTML(value) { return String(value).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    function handleClockSecret() {
      playerState.clockClicks = (playerState.clockClicks || 0) + 1;
      if (playerState.clockClicks >= 3 && playerState.secretsFound.indexOf('clock') === -1) {
        playerState.secretsFound.push('clock');
        saveGame();
        renderRoom();
        renderStats();
      } else {
        saveGame();
      }
    }

    window.addEventListener('DOMContentLoaded', initGame);
    window.whisperingHotelDebug = { startRoom: startRoomFromDebug, resetGame: resetGame, questionBank: questionBank, rooms: rooms };
  </script>
</body>
